version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: taptotphone-db
    environment:
      POSTGRES_DB: taptotphone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taptotphone"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: taptotphone-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: taptotphone-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: taptotphone-app
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8080:8080"
      - "6000:6000"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/taptotphone
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgrespassword
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - TAPTOTPHONE_JPOS_PORT=6000
      - TAPTOTPHONE_SECURITY_FPE_KEY=0123456789ABCDEF0123456789ABCDEF
      - TAPTOTPHONE_MPOC_CLOUD_VALIDATION_URL=https://mpoc-cloud-validator.secure-payments.net/v1/attest
    restart: on-failure

volumes:
  pgdata:
